{% extends "base.html" %}

{% block title %}500 - Server Error — Smart Quiz{% endblock %}

{% block content %}
<div class="container" style="padding: 60px 20px; text-align: center;">
  <div style="font-size: 64px; margin-bottom: 16px;">⚠️</div>
  <h1 style="font-size: 36px; font-weight: 800; margin-bottom: 12px;">Internal Server Error</h1>
  <p style="font-size: 16px; color: var(--text-muted); max-width: 500px; margin: 0 auto 28px;">
    An unexpected error occurred while processing your request.
  </p>
  {% if error %}
    <div style="background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 12px; border-radius: 8px; max-width: 600px; margin: 0 auto 24px; font-family: monospace; font-size: 13px;">
      {{ error }}
    </div>
  {% endif %}
  <a href="{{ url_for('index') }}" class="btn-primary" style="display: inline-block; width: auto;">Return to Home</a>
</div>
{% endblock %}
